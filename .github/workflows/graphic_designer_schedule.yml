name: Graphic Designer Monday Review Schedule

on:
  schedule:
    # Runs every Monday at 03:30 UTC (9:00 AM IST), 08:30 UTC (2:00 PM IST), and 13:30 UTC (7:00 PM IST)
    - cron: '30 3,8,13 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  send-monday-review:
    runs-on: ubuntu-latest
    steps:
      - name: Send Graphic Designer Review Notification
        run: |
          # Calculate current day of month
          DAY_OF_MONTH=$(date +%-d)

          # Determine Creative Number based on week of the month
          if [ "$DAY_OF_MONTH" -le 7 ]; then
            CREATIVE_NAME="Single Creative 1"
          elif [ "$DAY_OF_MONTH" -le 14 ]; then
            CREATIVE_NAME="Single Creative 2"
          elif [ "$DAY_OF_MONTH" -le 21 ]; then
            CREATIVE_NAME="Single Creative 3"
          else
            CREATIVE_NAME="Single Creative 4"
          fi

          # Get current UTC hour to determine morning, mid-day, or evening message
          HOUR_UTC=$(date +%-H)

          if [ "$HOUR_UTC" -le 5 ]; then
            TIME_LABEL="Morning Kickoff"
            MSG="Good morning Sathwika! Today is review day for ${CREATIVE_NAME}. Please submit your initial drafts by 2:00 PM."
            TAGS="art,calendar,warning"
            PRIORITY="high"
          elif [ "$HOUR_UTC" -le 10 ]; then
            TIME_LABEL="Mid-day Check"
            MSG="Mid-day reminder: Please upload your draft designs for ${CREATIVE_NAME} for client review."
            TAGS="art,clock2"
            PRIORITY="default"
          else
            TIME_LABEL="Evening Sign-off"
            MSG="Final reminder for ${CREATIVE_NAME} reviews today. Deadline for Wednesday publishing."
            TAGS="art,alarm_clock"
            PRIORITY="high"
          fi

          TITLE="🎨 Monday Review Day (${TIME_LABEL}) - ${CREATIVE_NAME}"

          echo "Publishing notification: $TITLE"

          curl -s -o /dev/null \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Priority: $PRIORITY" \
            -d "$MSG" \
            https://ntfy.sh/agency_graphic_designer_8186
