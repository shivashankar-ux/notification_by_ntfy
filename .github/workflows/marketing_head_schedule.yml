          }

          // Determine current UTC hour to format title and message
          const utcHour = now.getUTCHours();
          let title = "";
          let msgPrefix = "";

          if (utcHour <= 4) { // 09:00 AM IST
            title = "📢 Today'\''s Creative Deadlines";
            msgPrefix = "Today'\''s review deadlines:";
          } else if (utcHour <= 6) { // 11:00 AM IST
            title = "📢 Creative Deadline Reminder";
            msgPrefix = "Reminder: Today'\''s creative reviews are due today.";
          } else if (utcHour <= 9) { // 02:00 PM IST
            title = "📢 Creative Deadline Check";
            msgPrefix = "Please track today'\''s pending creative reviews.";
          } else if (utcHour <= 12) { // 05:00 PM IST
            title = "📢 Final Review Window";
            msgPrefix = "Final review window approaching.";
          } else { // 07:00 PM IST
            title = "📢 Creative Deadline";
            msgPrefix = "Final reminder: Today'\''s creative reviews should be completed.";
          }

          const messageBody = msgPrefix + "\n" + deliverables;

          console.log("Sending Notification to Heena ji (agency_marketing_8186):");
          console.log("Title: " + title);
          console.log("Message:\n" + messageBody);

          // HTTP POST request to ntfy
          const postData = messageBody;
          const reqOptions = {
            hostname: "ntfy.sh",
            port: 443,
            path: "/agency_marketing_8186",
            method: "POST",
            headers: {
              "Title": title,
              "Content-Type": "text/plain; charset=utf-8",
