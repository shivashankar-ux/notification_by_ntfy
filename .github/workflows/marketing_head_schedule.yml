    # UTC times corresponding to 09:00, 11:00, 14:00, 17:00, 19:00 IST
    # 09:00 IST = 03:30 UTC
    # 11:00 IST = 05:30 UTC
    # 14:00 IST = 08:30 UTC
    # 17:00 IST = 11:30 UTC
    # 19:00 IST = 13:30 UTC
    - cron: '30 3,5,8,11,13 * * 1,2,3,4'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
